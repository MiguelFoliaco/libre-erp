
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: postgres:18-alpine
    container_name: libreerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: libreerp
      POSTGRES_USER: libreerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libreerp_dev}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - c
      - cron.database_name=libreerp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libreerp -d libreerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: libreerp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-libreerp_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-libreerp_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
